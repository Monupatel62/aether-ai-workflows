name: Workflow graph validator

on:
  pull_request:
    paths:
      - "scripts/validate_workflow_graph.py"
      - "tests/test_validate_workflow_graph.py"
      - ".github/workflows/workflow-graph-validation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/validate_workflow_graph.py"
      - "tests/test_validate_workflow_graph.py"
      - ".github/workflows/workflow-graph-validation.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run graph validator tests
        run: python -m unittest discover -s tests -p "test_validate_workflow_graph.py" -v
